<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品管理</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap head-inner">
    <div>
      <h1>作品管理</h1>
      <p class="sub" id="who">只有你可以上传与删除</p>
    </div>
    <nav class="links">
      <a href="/">返回作品集</a>
      <button class="ghost" id="logout" type="button" hidden>退出登录</button>
    </nav>
  </div>
</header>

<section id="login-view" class="center">
  <form class="box" id="login-form">
    <h2>请输入管理密码</h2>
    <label for="password">密码</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button class="primary" type="submit">进入</button>
    <div class="msg" id="login-msg"></div>
    <p class="login-note">会话保存在 HttpOnly Cookie 中，14 天后过期。</p>
  </form>
</section>

<section id="admin-view" class="admin-wrap" hidden>
  <div class="admin-grid">
    <div class="panel">
      <h2 id="form-title">上传新作品</h2>
      <p class="hint" id="form-hint">选择视频后自动抓取封面；抓帧后可调时间点重截。</p>
      <div class="drop" id="drop">点击选择视频，或把文件拖到这里</div>
      <input type="file" id="file" accept="video/*" hidden>
      <div class="poster-preview" id="poster-preview"><img id="poster-img" alt="封面预览"></div>
      <div class="row" id="poster-tools" hidden>
        <div>
          <label for="poster-time">封面时间点（秒）</label>
          <input type="number" id="poster-time" min="0" step="0.1" value="1">
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button class="ghost" type="button" id="recapture" style="width:100%;">重新截帧</button>
        </div>
      </div>
      <label for="title">标题 *</label>
      <input id="title" maxlength="80" placeholder="例：爆裂斩 · 三版本迭代">
      <label for="description">简介</label>
      <textarea id="description" maxlength="600" placeholder="设计思路、用到的技术、迭代过程"></textarea>
      <label for="tags">标签（用逗号分隔）</label>
      <input id="tags" placeholder="斩击, 二次元, 色阶">
      <div class="row">
        <div>
          <label for="engine">引擎</label>
          <input id="engine" placeholder="UE5 / Unity">
        </div>
        <div>
          <label for="role">职责</label>
          <input id="role" placeholder="特效设计">
        </div>
      </div>
      <label for="order">排序权重（数字大的排前面）</label>
      <input id="order" type="number" value="0" step="1">
      <div class="progress" id="progress"><i id="progress-bar"></i></div>
      <button class="primary" id="submit" type="button">上传并发布</button>
      <button class="ghost" id="cancel-edit" type="button" style="width:100%;margin-top:10px;" hidden>取消编辑</button>
      <div class="msg" id="form-msg"></div>
    </div>

    <div class="panel">
      <h2>已发布作品 <span class="m" id="list-count"></span></h2>
      <p class="hint">「编辑文案」只改信息，不会重新上传视频；要换视频请删除后重传。</p>
      <div class="admin-list" id="list"></div>
    </div>
  </div>
</section>

<script src="/assets/admin.js" type="module"></script>
</body>
</html>
