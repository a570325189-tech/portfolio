<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特效作品集</title>
<meta name="description" content="游戏特效作品集">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap head-inner">
    <div>
      <h1 id="site-title">特效作品集</h1>
      <p class="sub" id="site-sub"></p>
    </div>
    <nav class="links" id="site-links"></nav>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="chips" id="tag-filter"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>还没有发布作品。</p>
  <nav class="pager" id="pager" hidden aria-label="分页">
    <button class="pg" id="pg-prev" type="button" aria-label="上一页">&#10094;</button>
    <span class="pg-nums" id="pg-nums"></span>
    <button class="pg" id="pg-next" type="button" aria-label="下一页">&#10095;</button>
    <span class="pg-jump">跳转 <input id="pg-input" type="text" inputmode="numeric" maxlength="3" aria-label="跳转到第几页"> 页</span>
  </nav>
</main>

<footer class="wrap foot"><span id="foot"></span></footer>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-backdrop" data-close="1"></div>
  <div class="lb-panel" role="dialog" aria-modal="true" aria-label="作品播放">
    <button class="lb-icon lb-close" data-close="1" aria-label="关闭">&#10005;</button>
    <button class="lb-icon lb-prev" id="lb-prev" aria-label="上一个">&#10094;</button>
    <button class="lb-icon lb-next" id="lb-next" aria-label="下一个">&#10095;</button>
    <div class="lb-stage"><video id="lb-video" controls playsinline preload="metadata"></video></div>
    <div class="lb-info">
      <h2 id="lb-title"></h2>
      <div class="chips" id="lb-tags"></div>
      <p id="lb-desc"></p>
      <div class="lb-meta" id="lb-meta"></div>
    </div>
  </div>
</div>

<div class="modal" id="email-modal" hidden>
  <div class="modal-backdrop" data-emclose="1"></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="邮箱">
    <button class="lb-icon modal-close" data-emclose="1" aria-label="关闭">&#10005;</button>
    <h2>我的邮箱</h2>
    <p class="modal-hint">点下面的地址即可复制</p>
    <div class="modal-value" id="email-value"></div>
    <button class="primary" id="email-copy" type="button">复制邮箱</button>
    <div class="msg" id="email-msg"></div>
  </div>
</div>

<script src="/assets/app.js" type="module"></script>
</body>
</html>
