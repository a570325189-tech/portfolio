<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特效作品集</title>
<meta name="description" content="游戏特效作品集">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap head-inner">
    <div>
      <h1 id="site-title">特效作品集</h1>
      <p class="sub" id="site-sub"></p>
    </div>
    <nav class="links" id="site-links"></nav>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="chips" id="tag-filter"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>还没有发布作品。</p>
</main>

<footer class="wrap foot"><span id="foot"></span></footer>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-backdrop" data-close="1"></div>
  <div class="lb-panel" role="dialog" aria-modal="true" aria-label="作品播放">
    <button class="lb-icon lb-close" data-close="1" aria-label="关闭">&#10005;</button>
    <button class="lb-icon lb-prev" id="lb-prev" aria-label="上一个">&#10094;</button>
    <button class="lb-icon lb-next" id="lb-next" aria-label="下一个">&#10095;</button>
    <div class="lb-stage"><video id="lb-video" controls playsinline preload="metadata"></video></div>
    <div class="lb-info">
      <h2 id="lb-title"></h2>
      <div class="chips" id="lb-tags"></div>
      <p id="lb-desc"></p>
      <div class="lb-meta" id="lb-meta"></div>
    </div>
  </div>
</div>

<script src="/assets/app.js" type="module"></script>
</body>
</html>
